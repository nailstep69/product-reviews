<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Вход</title>
</head>
<body>

<h1>Вход</h1>

<form method="post">
    {% csrf_token %}

    <p>
        <input type="text" name="username" placeholder="Логин">
    </p>

    <p>
        <input type="password" name="password" placeholder="Пароль">
    </p>

    <button type="submit">Войти</button>
</form>

<a href="{% url 'register' %}">Регистрация</a>

</body>
</html>
