<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Продукты</title>
</head>
<body>

<h1>Список продуктов</h1>

{% for product in products %}

    <h2>
        <a href="{% url 'product_detail' product.id %}">
            {{ product.name }}
        </a>
    </h2>

    <p>{{ product.description }}</p>
    <p>{{ product.created_at }}</p>

{% empty %}

    <p>Продуктов пока нет.</p>

{% endfor %}

</body>
</html>
